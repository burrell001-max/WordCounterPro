<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Proofreader – WordCounterPro</title>
<meta name="description" content="Listen back to your writing using browser voice speech synthesis to catch typos and grammatical mistakes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#14213d;--muted:#5b6785;--line:#d5dbe8;--accent:#f2a900;--on-accent:#14213d;--nav:#14213d;--on-nav:#eef1f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Instrument Sans",sans-serif}
nav{background:var(--nav);color:var(--on-nav);padding:14px 20px}
nav > div{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{font:700 24px "Newsreader",serif;text-decoration:none;color:inherit}.logo b{background:var(--accent);color:var(--on-accent);padding:2px 6px;border-radius:4px}
.wrap{max-width:1000px;margin:30px auto;padding:0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.03)}
h1{font:600 36px "Newsreader",serif;margin:0 0 10px}
textarea{width:100%;min-height:260px;padding:16px;font:18px/1.6 "Newsreader",serif;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}
button{padding:10px 18px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;border-radius:6px;cursor:pointer}
button:hover{opacity:0.9}
footer{background:var(--nav);color:var(--on-nav);text-align:center;padding:20px;margin-top:60px;font-size:14px}
</style>
</head>
<body>
<nav><div><a class="logo" href="index.html">WordCounter<b>Pro</b></a><a href="index.html" style="color:inherit;text-decoration:none;font-weight:500;">« Back to Main Counter</a></div></nav>
<main class="wrap">
<div class="card">
  <h1>Voice Proofreader Tool</h1>
  <p style="color:var(--muted);">Listen to your text read aloud to quickly identify awkward phrasing and typos.</p>
  <textarea id="box" placeholder="Paste your text draft here to read aloud..."></textarea>
  <div class="btns">
    <button id="playBtn" onclick="toggleRead()">Start Reading Aloud</button>
    <label style="font-size:14px;color:var(--muted);">Speed: 
      <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
    </label>
  </div>
</div>
</main>
<footer><p>© WordCounterPro. Contact: WordCounterPro@outlook.com</p></footer>
<script>
const b=document.getElementById('box'),btn=document.getElementById('playBtn'),rate=document.getElementById('rate');
let playing=false;
function toggleRead(){
  if(playing){window.speechSynthesis.cancel();playing=false;btn.textContent="Start Reading Aloud";return;}
  if(!b.value.trim())return;
  const ut=new SpeechSynthesisUtterance(b.value);
  ut.rate=parseFloat(rate.value);
  ut.onend=()=>{playing=false;btn.textContent="Start Reading Aloud";};
  window.speechSynthesis.speak(ut);
  playing=true;
  btn.textContent="Stop Reading";
}
</script>
</body>
</html>
